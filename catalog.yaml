# 蒐集カタログ
#
# ここに「集めたい話」を1エントリずつ登録し、tools/collect.py で取得する。
# 取得済みの本文は stories/<slug>.md に、取得時の生データは raw/<slug>.json に保存される。
#
# エントリの書式:
#   - slug:    ファイル名になる識別子(ローマ字推奨)
#     title:   正式タイトル
#     aliases: 別名・表記ゆれ(任意)
#     tags:    分類タグ(任意)
#     note:    一言メモ(任意)
#     origin:  初出情報(わかる範囲で。不確かなら書かない)
#     source:  取得元。type: wordpress なら WP REST API 経由で取得。
#              type: url なら生HTMLを保存してテキスト抽出(精度は落ちる)。
#     status:  wanted = 取得元未定・未発見。collect.py はスキップする。
#
# dangi.link は旧 syarecowa.moo.jp(死ぬ程洒落にならない怖い話を集めてみない?まとめ)の移転先。

defaults:
  wordpress_api: &dangi
    type: wordpress
    site: dangi.link
    api: https://dangi.link/wp-json/wp/v2

